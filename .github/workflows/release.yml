# Release gate for the 3.x line: the version-bearing files must agree with
# each other and with the tag, and a pre-release draft appears on GitHub.
# 3.0 ships as a native app; the Docker image job that lived here through
# 2.x is gone on purpose (#77) - the desktop bundle is built and attached
# from a Mac, since PyInstaller/electron-builder need the target OS.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the desktop app for, e.g. v3.0.0-alpha.1"
        required: true

jobs:
  # Guard against the drift that let .claude-plugin/plugin.json ship three
  # releases stale (issue #7): the version-bearing files must agree with
  # each other, and — when released from a tag — with the tag itself.
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Versions match across all files (and the tag)
        run: |
          pyproject=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          dashboard=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' dashboard/package.json | head -1)
          plugin=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' .claude-plugin/plugin.json | head -1)
          codex_plugin=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' .codex-plugin/plugin.json | head -1)
          desktop=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' desktop/package.json | head -1)
          echo "pyproject=$pyproject dashboard=$dashboard plugin=$plugin codex_plugin=$codex_plugin desktop=$desktop"
          if [ "$pyproject" != "$dashboard" ] || [ "$pyproject" != "$plugin" ] || [ "$pyproject" != "$codex_plugin" ] || [ "$pyproject" != "$desktop" ]; then
            echo "::error::version mismatch across files — run scripts/bump_version.py"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pyproject" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $pyproject"
              exit 1
            fi
          fi

  # A GitHub Release used to be created by hand and was forgettable — now a
  # draft appears automatically for every version tag. It ships with
  # generated notes; polishing the title/notes and publishing stays a human
  # step on purpose (release names here carry personality).
  github-release:
    needs: verify-version
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Draft the release unless one already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — nothing to do"
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "$GITHUB_REF_NAME" $prerelease
          fi

  # The desktop app is the product in 3.x. macOS runners build the packaged
  # daemon (PyInstaller) and the Electron bundle and attach them to the
  # release, so every tag gets a downloadable app - unsigned for now
  # (signing/notarisation needs Apple certificates as secrets; #72 family).
  desktop-app:
    needs: [verify-version]
    runs-on: macos-14
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
      # The offline speech engine (faster-whisper + kokoro) is an opt-in
      # extra for pip users, but the app must ship it: its dashboard offers
      # "local (offline) engine" and PyInstaller only bundles what is
      # installed. Without --extra local the daemon shrinks by ~50 MB and
      # that option fails with an install hint (alpha.3 shipped like that).
      - run: uv sync --extra local
      # PyInstaller is a build-time tool, not a project dependency; the npm
      # script expects it in the project venv (.venv/bin/pyinstaller).
      - run: uv pip install pyinstaller
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dashboard, website and desktop dependencies
        run: |
          # The dashboard build type-checks the shared analytics module under
          # website/src, which needs website's packages (posthog-js) installed.
          (cd website && npm ci)
          (cd dashboard && npm ci)
          (cd desktop && npm ci)
      - name: Build the dashboard and the packaged daemon
        working-directory: desktop
        run: |
          npm run build:ui
          npm run build:daemon
      - name: Package the macOS app
        working-directory: desktop
        run: npx electron-builder --mac --publish never
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The draft may not exist yet on a fresh tag (github-release job
          # runs in parallel); wait for it briefly rather than racing.
          for i in $(seq 1 30); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 10
          done
          ls -la desktop/dist
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber desktop/dist/*.dmg desktop/dist/*.zip
