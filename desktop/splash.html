<!doctype html>
<meta charset="utf-8">
<title>Noisy Studio</title>
<!-- The launch splash (#96). Mirrors dashboard/src/components/Splash.vue,
     look "row": a self-contained page so it needs neither the daemon nor
     the dashboard bundle - it exists only to prove the app is alive while
     the engine boots. No status text: nothing here is actionable. -->
<style>
  html, body { margin: 0; height: 100%; background: #151619; }
  .splash {
    --ink: #edeef0; --line: #363940; --accent: #80d1cb;
    height: 100%; box-sizing: border-box; color: var(--ink);
    display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto;
    column-gap: 14px; row-gap: 22px; justify-content: center; align-content: center;
    font: 500 17px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.02em;
    -webkit-app-region: drag; user-select: none;
  }
  .icon { width: 36px; height: 36px; grid-column: 1; grid-row: 1; }
  .name { grid-column: 2; grid-row: 1; align-self: center; }
  .track { grid-column: 1 / span 2; grid-row: 2; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar { width: 38%; height: 100%; border-radius: 2px; background: var(--accent); animation: slide 1.2s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 62% } }
</style>
<div class="splash" role="status" aria-label="Noisy Studio is starting">
  <svg class="icon" viewBox="0 0 46 46" aria-hidden="true">
    <rect x="3" y="3" width="40" height="40" rx="11" fill="#263448"/>
    <g stroke="#b8cff3" stroke-width="3.2" stroke-linecap="round"><path d="M14 17v12 M20 11v24 M26 15v16 M32 19v8"/></g>
  </svg>
  <div class="name">Noisy Studio</div>
  <div class="track" aria-hidden="true"><div class="bar"></div></div>
</div>
