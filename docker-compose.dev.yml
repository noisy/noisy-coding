# Run your WORKING TREE in the container (contributors / debugging).
# Production uses docker-compose.yml, which pins the published image.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Distinct image tag + container name so a local build can never shadow
# the published noisy/noisy-coding image that prod runs.

services:
  noisy-coding-dev:
    build: .
    image: noisy-coding-dev:local
    container_name: noisy-coding-dev
    ports:
      - "127.0.0.1:8765:8765"   # HTTP API + dashboard
      - "127.0.0.1:8766:8766"   # tab-audio WebSocket bridge
      - "127.0.0.1:8767:8767"   # MCP server (streamable HTTP)
    volumes:
      - noisy-coding-config:/root/.config/noisy-coding
    restart: unless-stopped

volumes:
  noisy-coding-config:
    name: noisy-coding_noisy-coding-config
    external: true
