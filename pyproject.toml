[project]
name = "noisy-coding"
version = "2.13.1"
description = "Voice coding for Claude Code — talk to your agent while it works (Grok/xAI voice backend)"
readme = "README.md"
authors = [
    { name = "Krzysztof Szumny", email = "noisy.pl@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # Major-version ceilings everywhere: the Docker build installs from
    # pyproject (`uv pip install -e .`), NOT from uv.lock, so an unpinned
    # dependency can silently jump a major in a rebuild. That is exactly how
    # mcp 2.0.0 (which removed mcp.server.fastmcp) crash-looped the v2.13.0
    # image (#29). Raise a ceiling deliberately, with a test run — never via
    # a surprise resolver upgrade.
    "httpx>=0.28.1,<1",
    "mcp[cli]>=1.28.1,<2",
    "numpy>=2.5.1,<3",
    "sounddevice>=0.5.5,<0.6",
    "websockets>=16.0,<17",
]

[project.scripts]
noisy-coding-mcp = "noisy_coding.server:main"
noisy-coding-listener = "noisy_coding.listener.daemon:main"
noisy-coding-mobile = "noisy_coding.mobile_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]
